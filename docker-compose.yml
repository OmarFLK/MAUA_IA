services:
  postgres:
    image: postgres:17-alpine
    container_name: maua-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: maua_ai
      POSTGRES_USER: maua
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env local}
    ports:
      - "5432:5432"
    volumes:
      - maua_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maua -d maua_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  maua_postgres_data:

